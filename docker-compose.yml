services:
  postgres:
    image: postgres:16-alpine3.22
    container_name: postgres_db_general
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - spring-postgresql

  spring-boot:
    container_name: my-java-app
#    build:
#      context: .
#    image: ${IMAGE_SPRINGBOOT_CICD}
    image: springthymeleaf01:latest
    ports:
      - 8089:8080
    environment:
      DATASOURCE_URL: ${DB_URL:-url}
      DATASOURCE_USERNAME: ${POSTGRES_USER:-username}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
    networks:
      - spring-postgresql

volumes:
  postgresql-data:

networks:
  spring-postgresql: