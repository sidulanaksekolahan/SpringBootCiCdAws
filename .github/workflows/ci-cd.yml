name: Spring Boot CI CD AWS

on:
  pull_request:
    branches:
      - master

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java (adjust the version based on your project)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Cache Maven dependencies (optional for faster builds)
      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # Step 4: Run Unit Tests
      - name: Run tests
        run: mvn test

      # Step 5: Build the JAR file
      - name: Build JAR file
        run: mvn clean package

      # Step 6: Login to Docker Hub
      - name: Login to Docker Hub
        run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}

      # Step 7: Get short commit hash
      - name: Get short commit hash
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV # This appends the following line to the $GITHUB_ENV file

      # Step 8: Build the Docker image
      - name: Build Docker Image
        run: |
         docker build -t ${{ secrets.DOCKER_USERNAME }}/springbootcicdaws:${{ env.SHORT_SHA }} .
         docker tag ${{ secrets.DOCKER_USERNAME }}/springbootcicdaws:${{ env.SHORT_SHA }} ${{ secrets.DOCKER_USERNAME }}/springbootcicdaws:latest

      # Step 9: Push the Docker image to Docker Hub
      - name: Push Docker Image
        run: |
         docker push ${{ secrets.DOCKER_USERNAME }}/springbootcicdaws:${{ env.SHORT_SHA }}
         docker push ${{ secrets.DOCKER_USERNAME }}/springbootcicdaws:latest

  deploy:
    needs: build_and_test # the deploy job will wait until the build_and_test job is completed successfully.
    runs-on: [springboot-aws-ec2]

    steps:
      # Step 1: Stop docker compose
      - name: Stop docker compose
        run: docker compose down

      # Step 2: Remove old docker image
      - name: Remove old Docker image
        run: |
          IMAGE_ID=$(docker images -q mirfanduri/springbootcicdaws:latest)
          if [ -n "$IMAGE_ID" ]; then
            echo "Removing old image: $IMAGE_ID"
            docker rmi $IMAGE_ID || true  # 'true' to ignore error if image doesn't exist
          fi

      # Step 3: Pull image from Docker Hub
      - name: Pull image from Docker Hub
        run: docker pull mirfanduri/springbootcicdaws:latest

      # Step 4: Run docker compose using environment file
      - name: Run docker compose
        run: docker compose --env-file .env up -d